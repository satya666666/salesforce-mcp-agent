[project]
name = "q2c-mcp-agents"
version = "0.1.0"
description = "MCP servers that expose Salesforce Sales Cloud (Opportunity, Quote, Renewal) and a Zuora-style billing service to AI agents, plus a renewal orchestrator agent."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
salesforce-mcp = "q2c.salesforce.server:main"
billing-mcp = "q2c.billing.server:main"
renewal-agent = "q2c.agents.renewal_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/q2c"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
